apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-monitor
  labels:
    release: kube-prometheus-stack # ← должен совпадать с именем release Helm
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
  endpoints:
    - port: http # имя порта из Service
      path: /metrics
      interval: 15s
