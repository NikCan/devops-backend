apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-lesson
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-lesson
  template:
    metadata:
      labels:
        app: backend-lesson
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      containers:
        - name: backend-lesson
          image: ${BACKEND_IMAGE}
          resources:
            requests:
              cpu: "60m"
              memory: "150Mi"
            limits:
              cpu: "80m"
              memory: "180Mi"
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: lesson-secret
            - configMapRef:
                name: lesson-config
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 12 # 12 × 5 сек = 1 минута на старт
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-lesson-service
  labels:
    app: backend-lesson-service
spec:
  selector:
    app: backend-lesson
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack # ← должен совпадать с именем release Helm
spec:
  selector:
    matchLabels:
      app: backend-lesson-service
  endpoints:
    - port: http # имя порта из Service
      path: /metrics
      interval: 15s
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-lesson-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-lesson
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # target: 70% от CPU request
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80 # target: 80% от memory request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
